<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fem tabeller til handlingsplanen | Boligkompasset</title>
<meta name="robots" content="noindex">
<!-- Arbeidsside: fem forslag til «3. Handlingsplan», 3. november, etter
     iterasjon 29. Tilbakemeldingen 30. oktober: en slags tabell, med
     «Les mer» eller en rullegardin per tiltak, uten stegene og uten den
     grønne tilskuddsboksen. Alle fem er Fasadens tabell. Ikke lenket
     fra tjenesten. -->
<link rel="stylesheet" href="fasaden/boligkompasset-stiler.css?v=48">
<style>
  /* Velgeren øverst, og det lille som Fasaden ikke har */
  .ft-velger { position: sticky; top: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--hb-slate-200); padding: var(--space-3) 0; }
  .ft-velger .hb-buttongroup { flex-wrap: wrap; }
  .ft-om { margin: var(--space-2) 0 0; max-width: 70ch; }

  .ft-gruppe { margin: var(--space-4) 0 var(--space-3); }
  .ft-gruppe ~ .ft-gruppe { margin-top: var(--space-5); }
  .ft-tabell { width: 100%; }
  .ft-tabell td, .ft-tabell th { vertical-align: top; }
  .ft-tabell td.ft-velg { width: 2.5rem; }
  .ft-tabell td.ft-smal, .ft-tabell th.ft-smal { width: 6.5rem; }
  .ft-tabell td.ft-pil { width: 3rem; text-align: right; }
  .ft-tabell .kp-lesmer__innhold { font-size: inherit; line-height: inherit; margin-bottom: 0; }

  /* 1 og 2: raden folder ut en rad under, som Fasadens utvidbare tabell */
  .ft-pilknapp { background: none; border: 0; padding: 4px; margin: -4px; cursor: pointer; color: inherit; border-radius: 4px; display: inline-flex; }
  .ft-pilknapp svg { width: 20px; height: 20px; transition: transform .2s; }
  .ft-pilknapp:focus-visible { outline: 0.125rem dashed #3b444c; outline-offset: 2px; }
  .hb-table-row--expanded .ft-pilknapp svg, .hb-table-row--expanded .kp-lesmer__pil { transform: rotate(180deg); }
  .ft-utvidet td { padding-top: 0; }
  .ft-utvidet p { margin: 0; max-width: 62ch; }
  .fasaden .ft-tabell .hb-table-row--expandable { cursor: default; }
  .fasaden .ft-tabell .hb-table-row--expandable:hover { background: none; }

  /* 4: tilskudd som merke ved navnet */
  .ft-merke { margin-left: 6px; vertical-align: middle; }

  /* 5: valgte rader er grønne */
  .ft-tabell--markert tr:has(input:checked) td { background: var(--hb-green-100); }
  .ft-teller { font-weight: 400; color: var(--fg-subtle); font-size: var(--text-base); }
</style>
</head>
<body>

<div id="hb-topp"></div>

<div class="ft-velger fasaden">
  <div class="hb-shell">
    <fieldset class="hb-felt">
      <legend class="hb-text--semibold hb-mb--sm">Forslag til handlingsplanen</legend>
      <div class="hb-buttongroup hb-buttongroup--gap-none" id="ft-knapper"></div>
    </fieldset>
    <p class="ft-om hb-text--sm" id="ft-om" aria-live="polite"></p>
  </div>
</div>

<main id="hovedinnhold" class="fasaden">
  <section class="hb-section" style="padding-top:var(--space-5)">
    <div class="hb-shell" id="ft-side"></div>
  </section>
</main>

<div id="hb-bunn"></div>

<script src="assets/js/hb.js"></script>
<script src="assets/js/hb-kompass-data.js?v=32"></script>
<script src="assets/js/hb-kompass.js?v=46"></script>
<script>
/* ═══ Svarene ═════════════════════════════════════════════════════
   Har du svart i Boligkompasset i denne nettleseren, brukes svarene
   dine. Ellers et fast sett med tilfeldige svar, så alle fem viser det
   samme. */
S = kpLes();
if (!KOMPASS_SPORSMAL.some(kpBesvart)) {
  let fro = 7;
  const gammel = Math.random;
  Math.random = () => (fro = (fro * 16807) % 2147483647) / 2147483647;
  const tegn = kpTegn, lagre = kpLagre;
  kpTegn = () => {}; kpLagre = () => {};
  kpFyllTilfeldig();
  kpTegn = tegn; kpLagre = lagre; Math.random = gammel;
}

/* ═══ Felles ══════════════════════════════════════════════════════ */

const T = kpTiltakForslag();
const ALLE = [...T.enkel, ...T.stor];
const valgt = t => (S.handlingsplan || []).includes(t.id);
const fag = t => t.tekst.replace(KP_SOK_HUSBANKEN, ' ').trim();
const sok = t => KP_SOK_HUSBANKEN.test(t.tekst);
const tag = (tone, tekst, klasse = '') => `<span class="hb-tag hb-tag--${tone} ${klasse}"><span class="hb-tag-text">${tekst}</span></span>`;
const typenavn = t => t.type === 'enkel' ? 'Enkelt' : 'Større';

const boks = t => `<input class="hb-checkbox" id="ft-${t.id}" type="checkbox" name="handlingsplan" value="${t.id}" ${valgt(t) ? 'checked' : ''}><div class="hb-label"><label class="hb-label-tekst" for="ft-${t.id}"><span class="hb-screenreader-only">${t.tittel}</span></label></div>`;
const navn = t => `<label for="ft-${t.id}">${t.tittel}</label>`;

const tabell = (hode, rader, klasse = '') => `
  <div class="hb-scrollbox">
    <table class="hb-table ft-tabell ${klasse}">
      ${hode ? `<thead><tr>${hode}</tr></thead>` : ''}
      <tbody>${rader}</tbody>
    </table>
  </div>`;
const VELG = '<th scope="col" class="ft-velg"><span class="hb-screenreader-only">Velg</span></th>';

/* En rad som folder ut en rad under, med fagteksten over hele bredden */
const utvidbar = (t, celler, kolonner) => `
        <tr class="hb-table-row--expandable" data-ft-rad="${t.id}">${celler}</tr>
        <tr class="hb-table-row--expansion ft-utvidet" id="ft-tekst-${t.id}"><td></td><td colspan="${kolonner - 1}"><p>${fag(t)}</p></td></tr>`;

const grupper = fn => KP_TILTAKSTYPER.filter(ty => T[ty.id].length).map(ty => `
  <h3 class="hb-h4 ft-gruppe" data-ft-gruppe="${ty.id}">${ty.tittel}</h3>
  ${fn(T[ty.id], ty)}`).join('');

const innledning = `
  <h2 class="hb-h2 kp-seksjon" style="margin-top:0">3. Handlingsplan</h2>
  <p class="kp-hjelp__tekst">Her kommer det frem forslag til enkle og større grep du kan gjøre i boligen. Kryss av for tiltakene du ønsker å gjennomføre.</p>
  <p class="kp-hjelp__tekst">Trykk på «Les mer» for å få tips om mulige tiltak.</p>
  ${S.eieform === 'leier' ? `
  <div class="hb-callout hb-callout--info kp-planvarsel">
    <div class="hb-callout-body"><div class="hb-callout-content"><p>Du leier boligen. Endringer i boligen må avklares med utleier.</p></div></div>
  </div>` : ''}`;

const panel = `
  <div class="hb-panel hb-panel--noytral kp-planpanel">
    <h3 class="hb-h4">Handlingsplanen din</h3>
    <p class="hb-mb--xs" data-plan-antall aria-live="polite"></p>
    <p>Skriv ut handlingsplanen eller lagre den som PDF. Ta den med når du snakker med en entreprenør, kommunen eller familien.</p>
    <div class="hb-felt kp-planfeil" data-plan-feil-felt>
      <p class="hb-felt-feilmelding" data-plan-feil role="alert"></p>
    </div>
    <div class="hb-knappesamling">
      <div class="hb-knappesamling-gruppe hb-knappesamling-gruppe--horisontal">
        <div class="hb-knappesamling-element">${kpKnapp('Skriv ut handlingsplanen', 'data-lag-plan="valgte"')}</div>
        <div class="hb-knappesamling-element">${kpKnapp('Skriv ut alle tiltakene', 'data-lag-plan="alle"', 'standard')}</div>
      </div>
    </div>
  </div>`;

const pilknapp = t => `<button type="button" class="ft-pilknapp" aria-expanded="false" aria-controls="ft-tekst-${t.id}" data-ft-pil="${t.id}"><span class="hb-screenreader-only">Les mer om ${t.tittel.charAt(0).toLowerCase() + t.tittel.slice(1)}</span>${KP_PIL_NED}</button>`;
const lesmerknapp = t => `<button type="button" class="hb-button hb-button--link kp-lesmer" aria-expanded="false" aria-controls="ft-tekst-${t.id}" data-ft-pil="${t.id}"><span class="hb-button-text">Les mer</span><span class="kp-lesmer__pil" aria-hidden="true">${KP_PIL_NED}</span></button>`;

/* ═══ De fem forslagene ═══════════════════════════════════════════ */

const FORSLAG = [

/* 1 ─ Utvidbar rad med pil */
{ navn: 'Utvidbar rad', om: 'Fasadens utvidbare tabell. Pila til høyre i raden folder ut fagteksten i en rad under, over hele bredden. Navnet og avkrysningen står alene, så tabellen blir rolig.',
  html: () => grupper(liste => tabell(
    `${VELG}<th scope="col">Tiltak</th><th scope="col" class="ft-smal">Tilskudd</th><th scope="col" class="ft-pil"><span class="hb-screenreader-only">Les mer</span></th>`,
    liste.map(t => utvidbar(t, `<td class="ft-velg">${boks(t)}</td><td>${navn(t)}</td><td class="ft-smal">${sok(t) ? 'Ja' : '–'}</td><td class="ft-pil">${pilknapp(t)}</td>`, 4)).join(''))) },

/* 2 ─ «Les mer» i egen kolonne */
{ navn: 'Les mer-kolonne', om: '«Les mer» i en egen kolonne helt til høyre. Teksten folder seg ut i en rad under. Det er tydelig hvor man trykker, og navnene står på linje.',
  html: () => grupper(liste => tabell(
    `${VELG}<th scope="col">Tiltak</th><th scope="col" class="ft-smal">Tilskudd</th><th scope="col" class="ft-smal"><span class="hb-screenreader-only">Les mer</span></th>`,
    liste.map(t => utvidbar(t, `<td class="ft-velg">${boks(t)}</td><td>${navn(t)}</td><td class="ft-smal">${sok(t) ? 'Ja' : '–'}</td><td class="ft-smal">${lesmerknapp(t)}</td>`, 4)).join(''))) },

/* 3 ─ Én tabell */
{ navn: 'Én tabell', om: 'Enkle og større tiltak i én tabell, med en kolonne for typen. Én overskrift mindre, og alt står samlet. «Les mer» står ved navnet, som i iterasjon 29.',
  html: () => tabell(
    `${VELG}<th scope="col">Tiltak</th><th scope="col" class="ft-smal">Type</th><th scope="col" class="ft-smal">Tilskudd</th>`,
    ALLE.map(t => `<tr><td class="ft-velg">${boks(t)}</td><td>${navn(t)} ${kpLesMer(`<p>${fag(t)}</p>`)}</td><td class="ft-smal">${typenavn(t)}</td><td class="ft-smal">${sok(t) ? 'Ja' : '–'}</td></tr>`).join('')) },

/* 4 ─ Tilskudd som merke */
{ navn: 'Tilskudd som merke', om: 'Uten tilskuddskolonnen. Et grønt merke ved navnet viser at du kan søke tilskudd. «Les mer» står under navnet. Tabellen får bare to kolonner og mer plass til teksten.',
  html: () => grupper(liste => tabell(
    `${VELG}<th scope="col">Tiltak</th>`,
    liste.map(t => `<tr><td class="ft-velg">${boks(t)}</td><td>${navn(t)}${sok(t) ? tag('positive', 'Tilskudd', 'ft-merke') : ''}<br>${kpLesMer(`<p>${fag(t)}</p>`)}</td></tr>`).join(''))) },

/* 5 ─ Valgte rader markeres */
{ navn: 'Valgte markeres', om: 'Raden blir grønn når du krysser av, og overskriften teller hvor mange du har valgt. Uten tabellhode, så det ligner en liste, men med tabellens linjer.',
  html: () => grupper((liste, ty) => tabell('',
    liste.map(t => `<tr><td class="ft-velg">${boks(t)}</td><td>${navn(t)} ${kpLesMer(`<p>${fag(t)}</p>`)}</td><td class="ft-smal">${sok(t) ? tag('positive', 'Tilskudd') : ''}</td></tr>`).join(''), 'ft-tabell--markert')),
  etter: () => document.querySelectorAll('[data-ft-gruppe]').forEach(h => {
    const ty = KP_TILTAKSTYPER.find(x => x.id === h.dataset.ftGruppe);
    const n = T[ty.id].filter(valgt).length;
    h.innerHTML = `${ty.tittel} <span class="ft-teller">${n} av ${T[ty.id].length} valgt</span>`;
  }) }
];

/* ═══ Tegning og velger ═══════════════════════════════════════════ */

let gjeldende = 0;
function tegn(i) {
  gjeldende = i;
  const f = FORSLAG[i];
  document.getElementById('ft-side').innerHTML = `${innledning}<form class="kp-handlingsplan" novalidate>${f.html()}</form>${panel}`;
  document.getElementById('ft-om').innerHTML = `<strong>${i + 1}. ${f.navn}.</strong> ${f.om}`;
  document.querySelectorAll('#ft-knapper input').forEach((r, j) => { r.checked = j === i; });
  try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { /* lokal fil */ }
  oppdater();
}

function oppdater() {
  const n = (S.handlingsplan || []).length;
  document.querySelectorAll('[data-plan-antall]').forEach(p => {
    p.textContent = n ? `Du har krysset av for ${n} tiltak.` : 'Du har ikke krysset av for noen tiltak ennå.';
  });
  if (FORSLAG[gjeldende].etter) FORSLAG[gjeldende].etter();
}

document.getElementById('ft-knapper').innerHTML = FORSLAG.map((f, i) => `
  <input class="hb-radiobutton" type="radio" name="ft-forslag" id="ft-v${i}" value="${i}">
  <label class="hb-button hb-button--standard" for="ft-v${i}" title="${f.navn}">${i + 1}. ${f.navn}</label>`).join('');
document.getElementById('ft-knapper').addEventListener('change', ev => { tegn(Number(ev.target.value)); window.scrollTo(0, 0); });

document.addEventListener('change', ev => {
  if (ev.target.name !== 'handlingsplan') return;
  const v = new Set(S.handlingsplan || []);
  ev.target.checked ? v.add(ev.target.value) : v.delete(ev.target.value);
  S.handlingsplan = [...v];
  kpLagre();
  if (v.size) kpPlanFeil('');
  oppdater();
});

document.addEventListener('click', ev => {
  const t = ev.target.closest('button, a');
  if (!t) return;
  const d = t.dataset;
  if (d.ftPil) {
    const rad = document.querySelector(`[data-ft-rad="${d.ftPil}"]`);
    const aapen = !rad.classList.contains('hb-table-row--expanded');
    rad.classList.toggle('hb-table-row--expanded', aapen);
    t.setAttribute('aria-expanded', String(aapen));
  } else if (d.mer) {
    const p = document.getElementById(d.mer);
    const aapen = t.getAttribute('aria-expanded') === 'true';
    t.setAttribute('aria-expanded', String(!aapen));
    p.hidden = aapen;
  } else if (d.lagPlan !== undefined) kpLagPlan(d.lagPlan === 'alle');
});

hbMonter({ kontekst: 'Boligkompasset' });
tegn(Math.min(Math.max(Number(location.hash.slice(1)) || 1, 1), FORSLAG.length) - 1);
</script>
</body>
</html>
